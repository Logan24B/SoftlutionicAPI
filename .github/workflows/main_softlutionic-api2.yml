# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - softlutionic-api2

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_345EB86E048142DB97D79612243C8CB9 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_83B6748A7FCF42DE8AFB90EBD7660E8C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F1F6218FA5174EBFB4FF07F5762AAF7F }}

      - name: Configure contact push bridge
        shell: pwsh
        env:
          CONTACT_PUSH_SECRET: ${{ secrets.CONTACT_PUSH_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CONTACT_PUSH_SECRET.Length -lt 32) { throw 'Missing contact push repository secret.' }
          $settingsPath = [IO.Path]::GetTempFileName()
          try {
            @{
              'ContactPush__Secret' = $env:CONTACT_PUSH_SECRET
              'ContactPush__Endpoint' = 'https://softlutionic-sistema-eqh8cjdbbre4fndd.westus-01.azurewebsites.net/api/mobile/v1/push/contact/'
            } | ConvertTo-Json | Set-Content -LiteralPath $settingsPath -Encoding utf8
            $group = az webapp list --query "[?name=='softlutionic-api2'].resourceGroup | [0]" --output tsv
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($group)) { throw 'Cannot resolve contact API resource group.' }
            az webapp config appsettings set --resource-group $group --name softlutionic-api2 --settings "@$settingsPath" --output none
            if ($LASTEXITCODE -ne 0) { throw 'Cannot configure contact push bridge.' }
          } finally {
            Remove-Item -LiteralPath $settingsPath -Force
          }

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'softlutionic-api2'
          slot-name: 'Production'
          package: .

